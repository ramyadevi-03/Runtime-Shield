server {
    listen 8182;
    server_tokens off;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://opa:8182;
    }

    location = /v1/data/runtime_shield/authz/decision {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        proxy_pass http://opa:8182;
    }

    location / {
        return 404;
    }
}
