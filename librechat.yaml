version: 1.0.8

# Cache settings
cache: true

registration:
  socialLogins:
    - openid

# Explicit origins used by the MCP gateway and its Keycloak OAuth flow.
mcpSettings:
  allowedDomains:
    - "http://gateway:5001"
    - "https://host.docker.internal:8443"
    - "http://keycloak:8080"

# Per-user Keycloak OAuth is required for Runtime Shield tool calls.
mcpServers:
  runtime-shield-hitl:
    type: streamable-http
    title: "Runtime Shield HITL"
    url: "http://gateway:5001/mcp/runtime-shield"
    requiresOAuth: true
    oauth:
      authorization_url: "https://host.docker.internal:8443/realms/master/protocol/openid-connect/auth"
      token_url: "https://host.docker.internal:8443/realms/master/protocol/openid-connect/token"
      client_id: "${RUNTIME_SHIELD_MCP_CLIENT_ID}"
      client_secret: "${RUNTIME_SHIELD_MCP_CLIENT_SECRET}"
      redirect_uri: "http://localhost:3080/api/mcp/runtime-shield-hitl/oauth/callback"
      scope: "openid repository:read"
    serverInstructions: "Use github.read_repository only for the fixed local runtime-shield/demo repository; never choose a credential or upstream host. write_file is limited to secure-experiment-zone/ and requires administrator approval in the Runtime Shield dashboard."

# Custom Endpoints configuring Runtime Shield Gateway
endpoints:
  custom:
    - name: "Runtime Shield Gateway"
      apiKey: "${RUNTIME_SHIELD_GATEWAY_API_KEY}"
      baseURL: "http://gateway:5001/v1"
      models:
        default:
          - "runtime-shield-agent"
          - "meta-llama/Llama-3-8b-instruct"
        fetch: true
      titleConvo: true
      titleModel: "meta-llama/Llama-3-8b-instruct"
      summarize: false
      summaryModel: "meta-llama/Llama-3-8b-instruct"
      forcePrompt: false
      modelDisplayLabel: "Runtime Shield Gateway"
      headers:
        X-SPIFFE-ID: "spiffe://runtime-shield/llm-agent"
        X-SPIFFE-CERT: "${SPIFFE_LLM_CERT}"

# Model Specifications
modelSpecs:
  enforce: false
  list:
    - name: "runtime-shield-agent"
      label: "Runtime Shield Agent"
      description: "Protected agent with real-time OPA authz, Presidio PII masking, and multi-tenant RBAC enforcement."
      preset:
        endpoint: "Runtime Shield Gateway"
        model: "runtime-shield-agent"
        temperature: 0
        systemPrompt: "You are an intelligent banking and research assistant at Meridian HealthTech protected by Secure Runtime Shield. Answer user queries concisely."
