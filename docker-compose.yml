services:

  keycloak:
    container_name: keycloak_mcp
    image: quay.io/keycloak/keycloak:26.5.3
    user: "0:0"
    command: ["start-dev", "--features=token-exchange"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: kavss
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8083:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    restart: always


  spire-server:
    container_name: spire-server
    image: ghcr.io/spiffe/spire-server:1.8.0
    command:
      - "-config"
      - "/run/spire/config/server.conf"
    volumes:
      - ./spire/server:/run/spire/config
      - ./spire/certs:/run/spire/certs:ro
      - spire-server-data:/opt/spire/data
    restart: always


  spire-agent:
    container_name: spire-agent
    image: ghcr.io/spiffe/spire-agent:1.8.0
    user: "0:0"
    command:
      - "-config"
      - "/run/spire/config/agent.conf"
    volumes:
      - ./spire/agent:/run/spire/config
      - ./spire/certs:/run/spire/certs:ro
      - ./spire/agent/passwd:/etc/passwd:ro
      - ./spire/agent/group:/etc/group:ro
      - spire-agent-socket:/run/spire/sockets
    depends_on:
      - spire-server
    restart: always

  opa:
    container_name: opa_mcp
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=:8182"
    ports:
      - "8182:8182"
    restart: always


  gateway:
    container_name: gateway_mcp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
      - "9090:9090"
      - "5002:5002"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - OPA_URL=http://opa:8182/v1/data/runtime_shield/authz/decision
      - KEYCLOAK_REALM=master
      - KEYCLOAK_CLIENT_ID=admin-cli
      - KEYCLOAK_CLIENT_SECRET=vsIwGjbvAqpk1tdDeZGEUZAaFPR0ItG3
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - LOCAL_DEV_MODE=false
      - SPIFFE_ENABLED=true
      - SPIFFE_BRIDGE_ID=spiffe://runtime-shield/bridge
      - SPIFFE_SERVER_ID=spiffe://runtime-shield/secure-runtime-shield
      - ALLOWED_SPIFFE_IDS=spiffe://runtime-shield/agent,spiffe://runtime-shield/dashboard,spiffe://runtime-shield/bridge,spiffe://runtime-shield/secure-runtime-shield,spiffe://runtime-shield/llm-agent
      - SPIRE_AGENT_SOCKET=/run/spire/sockets/agent.sock
      - SPIFFE_SVID_PATH=/app/spire/certs/bridge.crt
      - SPIFFE_BUNDLE_PATH=/app/spire/certs/ca.crt
      - SPIFFE_HEADER_ONLY_FALLBACK=true
      - NVIDIA_API_KEY=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
      - NIM_BASE_URL=https://integrate.api.nvidia.com/v1
      - HF_TOKEN=${HUGGINGFACE_TOKEN}
    volumes:
      - spire-agent-socket:/run/spire/sockets:ro
      - ./spire/certs:/app/spire/certs:ro
    depends_on:
      - keycloak
      - spire-agent
      - opa
    restart: always


  mongodb:
    container_name: mongodb_mcp
    image: mongo:latest
    volumes:
      - mongo-data:/data/db
    restart: always

  chatbot:
    container_name: chatbot_mcp
    image: ghcr.io/danny-avila/librechat:latest
    ports:
      - "8501:8501"
      - "3080:8501"
    environment:
      - HOST=0.0.0.0
      - PORT=8501
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - DOMAIN_CLIENT=https://chat.sc.deeptrustxai.com
      - DOMAIN_SERVER=https://chat.sc.deeptrustxai.com
      - JWT_SECRET=runtime_shield_jwt_secret_super_secure_123
      - JWT_REFRESH_SECRET=runtime_shield_refresh_secret_456
      - CREDS_KEY=f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3f31798823b19
      - CREDS_IV=e234cd426303d7788fa7a7a451a345f8
      - CONFIG_PATH=/app/librechat.yaml
      - ALLOW_REGISTRATION=true
      - ALLOW_EMAIL_LOGIN=true
      - ALLOW_SOCIAL_LOGIN=false
      - ALLOW_SOCIAL_REGISTRATION=false
      - SESSION_EXPIRY=86400000
      - REFRESH_TOKEN_EXPIRY=604800000
      - SPIFFE_LLM_ID=spiffe://runtime-shield/llm-agent
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat-uploads:/app/uploads
      - librechat-images:/app/client/public/images
      - spire-agent-socket:/run/spire/sockets:ro
      - ./spire/certs:/app/spire/certs:ro
    depends_on:
      - gateway
      - mongodb
      - keycloak
    restart: always


volumes:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  keycloak-data:
  mongo-data:
  librechat-uploads:
  librechat-images:

networks:
  default:
    name: dokploy-network
    external: true
