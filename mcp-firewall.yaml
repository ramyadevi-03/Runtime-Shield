# mcp-firewall Policy Configuration
# This file defines the security guardrails for the keycloak-mcp-server

# Global Configuration
global:
  dashboard_port: 9090
  audit_log: audit.log
  fail_open: false  
secrets:
  enabled: true
  action: redact

pii:
  enabled: true
  action: redact
  severity: medium
  placeholder: "[PII REDACTED]"
  # Presidio entity types to detect for standard users.
  # "ALL" turns on all standard Presidio PII recognizers dynamically.
  presidio_entities:
    - ALL
  # Entity types to exclude from auto-detection to prevent false-positives (like row IDs flagged as years)
  presidio_exclude_entities:
    - DATE_TIME
    - URL

nemo_cloud:
  enabled: true
  jailbreak_rail:
    enabled: true
    severity_threshold: 0.7
  pii_rail:
    enabled: true
    detect_entities: ["PERSON", "EMAIL_ADDRESS", "PHONE_NUMBER", "LOCATION", "CREDIT_CARD"]
  topical_rail:
    enabled: true
    allowed_topics: 
      - "Software development and engineering"
      - "System administration and DevOps"
      - "Cloud computing and MCP protocol"
      - "Cybersecurity and defense"
    blocked_topics:
      - "Financial advice and investment"
      - "Medical diagnosis and health"
      - "Political campaigning and opinions"
      - "Adult content and violence"

# Agent Identities & RBAC (Optional)
# We handle permissions in the general rules section below
agents: {}

# Zones and Environments (for Risk Assessment)
zones:
  - name: production
    color: red
    priority: critical
  - name: staging
    color: yellow
    priority: medium
  - name: dev
    color: blue
    priority: low

# Dynamic Blocks (Auto-populated by Quarantine Tool)
dynamic_blocks: []

# General Rules (evaluated in order: FIRST MATCH WINS)
rules:
#  # 0. Redact PII (Emails) from any response (DISABLED to test Microsoft NLP)
#  - name: redact-emails
#    tool: "*"
#    action: redact
#    message: "PII Redaction: Automated email masking active."
#    match:
#      arguments:
#        role: "user"
#      response:
#        regex: ".*@.*"
  # 1. Block directory traversal patterns (using globs)
  - name: block-traversal
    tool: "read_file|list_directory|write_file"
    match:
      arguments:
        path: "**/../*"
        role: "user"
    action: deny
    message: "Security violation: Potential directory traversal detected."
    risk_delta: 15
    priority: high

  # 2. Block specific unauthorized directories
  - name: block-admin-access
    tool: "read_file|list_directory"
    match:
      arguments:
        path: "admin/*"
        role: "user"
    action: deny
    message: "Access denied: The 'admin/' directory is off-limits."
    risk_delta: 15
    priority: high

  # 3. Allow access to the authorized folder
  - name: allow-claude-files
    tool: "read_file|list_directory|write_file"
    match:
      arguments:
        path: "secure-experiment-zone/claude-desktop**"
    action: allow
    message: "Workspace Access: Internal configuration tools permitted."
    risk_delta: 0

  # 4. Allow access to the Secure Experiment Zone (Safe Agent Workspace)
  - name: allow-experiment-zone-access
    tool: "read_file|list_directory|write_file"
    match:
      arguments:
        path: "secure-experiment-zone**"
    action: allow
    message: "Sandbox Access: Authorized experiment zone operations."
    risk_delta: 0

  # 6. Allow external-send tools for standard users (required for dangerous-chain demo)
  - name: allow-external-send
    tool: "http_post|fetch_url|curl|wget|send_request|http_request"
    match:
      arguments:
        role: "user"
    action: allow
    message: "External send tools are permitted for normal users (required for dangerous‑chain demo)."
    risk_delta: 0

  # 4. Block all other filesystem access for standard users (Defense in Depth)
  # 4. Block all other filesystem access for standard and privileged users (Defense in Depth)
  - name: block-unauthorized-fs
    tool: "read_file|list_directory|write_file"
    match:
      arguments:
        role: "user|privileged"
    action: deny
    message: "Security violation: Unauthorized filesystem access attempt."
    risk_delta: 15
    priority: high

  # 5. Block access to environment credential files (.env) for ALL roles
  - name: block-env-access
    tool: "read_file|write_file"
    match:
      arguments:
        path: "**.env*"
    action: deny
    message: "Security exception: Access to environment credential files (.env) is strictly prohibited for all roles."
    risk_delta: 20
    priority: high

  # 5. Allow admin unrestricted filesystem access throughout the project (inside and outside the zone)
  - name: allow-admin-unrestricted-fs
    tool: "read_file|list_directory|write_file"
    match:
      arguments:
        role: "admin"
    action: allow
    message: "Admin Access: Unrestricted filesystem access permitted."
    risk_delta: 0

  # 5. HONEYPOT TRAPS: Block access to fake internal tools without internal-admin scope
  - name: block-honeypots
    tool: "get_system_config|fetch_internal_db"
    action: deny
    message: "CRITICAL VIOLATION: Access to internal system management tools is strictly prohibited."
    risk_delta: 100
    priority: critical

  # 6. Restrict sensitive Keycloak administration tools to admin only
  - name: allow-keycloak-admin
    tool: "keycloak_list_users|keycloak_list_user_sessions|keycloak_revoke_user_sessions|keycloak_run_drills|keycloak_generate_policy|keycloak_quarantine_user"
    match:
      arguments:
        role: "admin"
    action: allow
    message: "Governance: Admin authorized to manage Keycloak and run drills."
    risk_delta: 0

  - name: deny-keycloak-admin
    tool: "keycloak_list_users|keycloak_list_user_sessions|keycloak_revoke_user_sessions|keycloak_run_drills|keycloak_generate_policy|keycloak_quarantine_user"
    action: deny
    message: "Access Denied: Keycloak administration is restricted to the administrator role."
    risk_delta: 15
    priority: high

  # 6b. Allow general Keycloak user profile/event read tools for normal/privileged
  - name: allow-keycloak-general
    tool: "keycloak_get_user_events|keycloak_security_report"
    action: allow
    message: "Governance: Keycloak diagnostic events read granted."
    risk_delta: 0
    zone: staging # Default zone for these tools

  # Default deny for all other roles or users invoking Keycloak tools.
  - name: deny-keycloak-tools-fallback
    tool: "keycloak_*"
    action: deny
    message: "Role violation: Keycloak governance tools require the 'admin' role."
    risk_delta: 15
    priority: high

  # 7. Default Allow for Sandboxed Database tools
  - name: allow-database-tools
    tool: "GetCurrentUser|GetUserTransactions"
    action: allow
    message: "Governance: Jailed database operations permitted."
    risk_delta: 0
    zone: production

  # 8. Allow admin to query active connections
  - name: allow-admin-active-connections
    tool: "GetActiveConnections"
    match:
      arguments:
        role: "admin"
    action: allow
    message: "Security: Admin authorized to read diagnostic active connections."
    risk_delta: 0

  # 9. Block other roles from querying active connections
  - name: deny-user-active-connections
    tool: "GetActiveConnections"
    action: deny
    message: "Security Violation: Non-admin role cannot view host active connections."
    risk_delta: 15
    priority: high

  # 10. Allow general scanner/monitor tools only for admin and privileged users
  - name: allow-general-diagnostics
    tool: "ScanDependencies|ScanSecrets|GetSystemMetrics"
    match:
      arguments:
        role: "admin|privileged"
    action: allow
    message: "Governance: Diagnostic scans permitted for privileged and admin roles."
    risk_delta: 0

  # 11. Block normal user role from running diagnostic scans
  - name: deny-user-diagnostics
    tool: "ScanDependencies|ScanSecrets|GetSystemMetrics"
    action: deny
    message: "Access Denied: Standard users cannot run diagnostic system scans."
    risk_delta: 15
    priority: high

  # ── Vulnerable MCP Challenge Rules ──────────────────────────────────────────

  # VulnChallenge-1: Block path traversal from the vulnerable filesystem MCP
  - name: block-vuln-fs-traversal
    tool: "vuln_read_file"
    match:
      arguments:
        path: "**/../**"
    action: deny
    message: "🛡️ Shield Block [Lab 1]: Directory traversal attack detected! Path escape via '../' is denied by Runtime Shield Policy Firewall."
    priority: critical

  # VulnChallenge-1b: Block access to absolute/OS sensitive paths
  - name: block-vuln-fs-absolute
    tool: "vuln_read_file"
    match:
      arguments:
        path: "/etc/**"
    action: deny
    message: "🛡️ Shield Block [Lab 1]: Absolute path to OS directory detected and denied by Runtime Shield."
    priority: critical

  # VulnChallenge-1c: Allow only safe paths through the vulnerable filesystem
  - name: block-vuln-fs-all-default
    tool: "vuln_read_file"
    action: deny
    message: "🛡️ Shield Block [Lab 1]: Unauthorized file path. Vulnerable filesystem MCP access is blocked by Runtime Shield policy."
    priority: high

  # VulnChallenge-2: Block eval code injection attempts via get_qotd format parameter
  - name: block-eval-injection-process
    tool: "vuln_get_qotd"
    match:
      arguments:
        format: "**process**"
    action: deny
    message: "🛡️ Shield Block [Lab 2]: eval() code injection payload detected! 'process' object access via format parameter is denied by Runtime Shield."
    priority: critical

  - name: block-eval-injection-require
    tool: "vuln_get_qotd"
    match:
      arguments:
        format: "**require**"
    action: deny
    message: "🛡️ Shield Block [Lab 2]: eval() code injection payload detected! 'require()' access via format parameter is denied by Runtime Shield."
    priority: critical

  - name: block-eval-injection-constructor
    tool: "vuln_get_qotd"
    match:
      arguments:
        format: "**constructor**"
    action: deny
    message: "🛡️ Shield Block [Lab 2]: eval() code injection payload detected! Prototype chain exploit via 'constructor' is denied by Runtime Shield."
    priority: critical

  # VulnChallenge-3: Block server IP leakage tool for all standard users
  - name: block-ip-leakage
    tool: "vuln_get_current_ip"
    action: deny
    message: "🛡️ Shield Block [Lab 3]: Server IP/infrastructure disclosure denied by Runtime Shield. This tool exposes sensitive server metadata."
    priority: high

  # VulnChallenge-4: Block run_diagnostic command injection (semicolons / pipes)
  - name: block-cmd-injection-semicolon
    tool: "vuln_run_diagnostic"
    match:
      arguments:
        operation: "**;**"
    action: deny
    message: "🛡️ Shield Block [Lab 4]: Command injection payload detected! Shell metacharacter ';' in diagnostic operation is denied by Runtime Shield."
    priority: critical

  - name: block-cmd-injection-pipe
    tool: "vuln_run_diagnostic"
    match:
      arguments:
        operation: "**|**"
    action: deny
    message: "🛡️ Shield Block [Lab 4]: Command injection payload detected! Shell metacharacter '|' in diagnostic operation is denied by Runtime Shield."
    priority: critical

  - name: block-cmd-injection-backtick
    tool: "vuln_run_diagnostic"
    match:
      arguments:
        operation: "**`**"
    action: deny
    message: "🛡️ Shield Block [Lab 4]: Command injection payload detected! Backtick subshell in diagnostic operation is denied by Runtime Shield."
    priority: critical

  # Allow safe diagnostic operations through
  - name: allow-safe-diagnostic
    tool: "vuln_run_diagnostic"
    action: allow
    message: "Governance: Safe diagnostic operation forwarded to vulnerable MCP."

  # VulnChallenge-4b: Allow Atlassian status (demonstrates prompt injection in response)
  - name: allow-atlassian-status
    tool: "vuln_get_atlassian_status"
    action: allow
    message: "Governance: Atlassian status tool allowed (demonstrates prompt injection in tool response)."

# Threat Feed Integration
threat_feed:
  enabled: true
  update_interval: 24h

# Tool Registry and MCP Server Routing
mcp_servers:
  filesystem-provider:
    command: "node"
    args: ["./dist/index.js", "."]
    tools:
      - name: "read_file"
        scope: "tool:read_file"
      - name: "write_file"
        scope: "tool:write_file"
      - name: "list_directory"
        scope: "tool:list_directory"
      - name: "fetch_url"
        scope: "tool:read_file"
      - name: "get_system_config"
        scope: "tool:admin_internal"
      - name: "fetch_internal_db"
        scope: "tool:admin_internal"
  
  keycloak-provider:
    command: "node"
    args: ["./dist/index.js"]
    tools:
      - name: "keycloak_list_users"
        scope: "tool:keycloak_read"
      - name: "keycloak_list_user_sessions"
        scope: "tool:keycloak_read"
      - name: "keycloak_revoke_user_sessions"
        scope: "tool:keycloak_admin"
      - name: "keycloak_get_user_events"
        scope: "tool:keycloak_read"
      - name: "keycloak_security_report"
        scope: "tool:keycloak_report"
      - name: "keycloak_generate_policy"
        scope: "tool:keycloak_report"
      - name: "keycloak_quarantine_user"
        scope: "tool:keycloak_admin"
      - name: "keycloak_run_drills"
        scope: "tool:keycloak_report"

  database-provider:
    command: "python"
    args: ["-u", "./database_mcp.py"]
    tools:
      - name: "GetCurrentUser"
        scope: "tool:keycloak_read"
      - name: "GetUserTransactions"
        scope: "tool:keycloak_read"

  scanner-provider:
    command: "python"
    args: ["-u", "./scanner_mcp.py"]
    tools:
      - name: "ScanDependencies"
        scope: "tool:keycloak_read"
      - name: "ScanSecrets"
        scope: "tool:keycloak_read"

  system-monitor-provider:
    command: "python"
    args: ["-u", "./system_monitor_mcp.py"]
    tools:
      - name: "GetSystemMetrics"
        scope: "tool:keycloak_read"
      - name: "GetActiveConnections"
        scope: "tool:keycloak_read"

# XAA Trusted Identity Providers configuration
trusted_identity_providers:
  - issuer: "https://external-idp.example.com"
    client_id: "external-client"
    jwks_url: "https://external-idp.example.com/oauth/jwks"
    role_mappings:
      "External-Admins": "Administrators"
      "External-Users": "Normal-Users"
