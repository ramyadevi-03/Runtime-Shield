# mcp-firewall Policy Configuration
# This file defines the security guardrails for the keycloak-mcp-server

# Global Configuration
global:
  dashboard_port: 9090
  audit_log: audit.log
  fail_open: false  
secrets:
  enabled: true
  action: redact

pii:
  enabled: true
  action: redact
  severity: medium
  placeholder: "[PII REDACTED]"
  # Presidio entity types to detect for standard users.
  # "ALL" turns on all standard Presidio PII recognizers dynamically.
  presidio_entities:
    - ALL
  # Entity types to exclude from auto-detection to prevent false-positives (like row IDs flagged as years)
  presidio_exclude_entities:
    - DATE_TIME
    - URL

nemo_cloud:
  enabled: true
  jailbreak_rail:
    enabled: true
    severity_threshold: 0.7
  pii_rail:
    enabled: true
    detect_entities: ["PERSON", "EMAIL_ADDRESS", "PHONE_NUMBER", "LOCATION", "CREDIT_CARD"]
  topical_rail:
    enabled: true
    allowed_topics: 
      - "Software development and engineering"
      - "System administration and DevOps"
      - "Cloud computing and MCP protocol"
      - "Cybersecurity and defense"
    blocked_topics:
      - "Financial advice and investment"
      - "Medical diagnosis and health"
      - "Political campaigning and opinions"
      - "Adult content and violence"

# Agent Identities & RBAC (Optional)
# We handle permissions in the general rules section below
agents: {}

# Zones and Environments (for Risk Assessment)
zones:
  - name: production
    color: red
    priority: critical
  - name: staging
    color: yellow
    priority: medium
  - name: dev
    color: blue
    priority: low

# Dynamic Blocks (Auto-populated by Quarantine Tool)
dynamic_blocks: []


# Policy Rules — REMOVED
# Rules are now managed in rules/runtime_shield_data.json and evaluated via OPA.
# See rules/runtime_shield.rego for the Rego evaluation policy.










  # ── Vulnerable MCP Challenge Rules ──────────────────────────────────────────

  # VulnChallenge-1: Block path traversal from the vulnerable filesystem MCP
  - name: block-vuln-fs-traversal
    tool: "vuln_read_file"
    match:
      arguments:
        path: "**/../**"
    action: deny
    message: "🛡️ Shield Block [Lab 1]: Directory traversal attack detected! Path escape via '../' is denied by Runtime Shield Policy Firewall."
    priority: critical

  # VulnChallenge-1b: Block access to absolute/OS sensitive paths
  - name: block-vuln-fs-absolute
    tool: "vuln_read_file"
    match:
      arguments:
        path: "/etc/**"
    action: deny
    message: "🛡️ Shield Block [Lab 1]: Absolute path to OS directory detected and denied by Runtime Shield."
    priority: critical

  # VulnChallenge-1c: Allow only safe paths through the vulnerable filesystem
  - name: block-vuln-fs-all-default
    tool: "vuln_read_file"
    action: deny
    message: "🛡️ Shield Block [Lab 1]: Unauthorized file path. Vulnerable filesystem MCP access is blocked by Runtime Shield policy."
    priority: high

  # VulnChallenge-2: Block eval code injection attempts via get_qotd format parameter
  - name: block-eval-injection-process
    tool: "vuln_get_qotd"
    match:
      arguments:
        format: "**process**"
    action: deny
    message: "🛡️ Shield Block [Lab 2]: eval() code injection payload detected! 'process' object access via format parameter is denied by Runtime Shield."
    priority: critical

  - name: block-eval-injection-require
    tool: "vuln_get_qotd"
    match:
      arguments:
        format: "**require**"
    action: deny
    message: "🛡️ Shield Block [Lab 2]: eval() code injection payload detected! 'require()' access via format parameter is denied by Runtime Shield."
    priority: critical

  - name: block-eval-injection-constructor
    tool: "vuln_get_qotd"
    match:
      arguments:
        format: "**constructor**"
    action: deny
    message: "🛡️ Shield Block [Lab 2]: eval() code injection payload detected! Prototype chain exploit via 'constructor' is denied by Runtime Shield."
    priority: critical

  # VulnChallenge-3: Block server IP leakage tool for all standard users
  - name: block-ip-leakage
    tool: "vuln_get_current_ip"
    action: deny
    message: "🛡️ Shield Block [Lab 3]: Server IP/infrastructure disclosure denied by Runtime Shield. This tool exposes sensitive server metadata."
    priority: high

  # VulnChallenge-4: Block run_diagnostic command injection (semicolons / pipes)
  - name: block-cmd-injection-semicolon
    tool: "vuln_run_diagnostic"
    match:
      arguments:
        operation: "**;**"
    action: deny
    message: "🛡️ Shield Block [Lab 4]: Command injection payload detected! Shell metacharacter ';' in diagnostic operation is denied by Runtime Shield."
    priority: critical

  - name: block-cmd-injection-pipe
    tool: "vuln_run_diagnostic"
    match:
      arguments:
        operation: "**|**"
    action: deny
    message: "🛡️ Shield Block [Lab 4]: Command injection payload detected! Shell metacharacter '|' in diagnostic operation is denied by Runtime Shield."
    priority: critical

  - name: block-cmd-injection-backtick
    tool: "vuln_run_diagnostic"
    match:
      arguments:
        operation: "**`**"
    action: deny
    message: "🛡️ Shield Block [Lab 4]: Command injection payload detected! Backtick subshell in diagnostic operation is denied by Runtime Shield."
    priority: critical

  # Allow safe diagnostic operations through
  - name: allow-safe-diagnostic
    tool: "vuln_run_diagnostic"
    action: allow
    message: "Governance: Safe diagnostic operation forwarded to vulnerable MCP."

  # VulnChallenge-4b: Allow Atlassian status (demonstrates prompt injection in response)
  - name: allow-atlassian-status
    tool: "vuln_get_atlassian_status"
    action: allow
    message: "Governance: Atlassian status tool allowed (demonstrates prompt injection in tool response)."

# Threat Feed Integration
threat_feed:
  enabled: true
  update_interval: 24h

# Tool Registry and MCP Server Routing
mcp_servers:
  filesystem-provider:
    command: "node"
    args: ["./dist/index.js", "."]
    tools:
      - name: "read_file"
        scope: "tool:read_file"
      - name: "write_file"
        scope: "tool:write_file"
      - name: "list_directory"
        scope: "tool:list_directory"
      - name: "fetch_url"
        scope: "tool:read_file"
      - name: "get_system_config"
        scope: "tool:admin_internal"
      - name: "fetch_internal_db"
        scope: "tool:admin_internal"
  
  keycloak-provider:
    command: "node"
    args: ["./dist/index.js"]
    tools:
      - name: "keycloak_list_users"
        scope: "tool:keycloak_read"
      - name: "keycloak_list_user_sessions"
        scope: "tool:keycloak_read"
      - name: "keycloak_revoke_user_sessions"
        scope: "tool:keycloak_admin"
      - name: "keycloak_get_user_events"
        scope: "tool:keycloak_read"
      - name: "keycloak_security_report"
        scope: "tool:keycloak_report"
      - name: "keycloak_generate_policy"
        scope: "tool:keycloak_report"
      - name: "keycloak_quarantine_user"
        scope: "tool:keycloak_admin"
      - name: "keycloak_run_drills"
        scope: "tool:keycloak_report"

  database-provider:
    command: "python"
    args: ["-u", "./database_mcp.py"]
    tools:
      - name: "GetCurrentUser"
        scope: "tool:keycloak_read"
      - name: "GetUserTransactions"
        scope: "tool:keycloak_read"

  scanner-provider:
    command: "python"
    args: ["-u", "./scanner_mcp.py"]
    tools:
      - name: "ScanDependencies"
        scope: "tool:keycloak_read"
      - name: "ScanSecrets"
        scope: "tool:keycloak_read"

  system-monitor-provider:
    command: "python"
    args: ["-u", "./system_monitor_mcp.py"]
    tools:
      - name: "GetSystemMetrics"
        scope: "tool:keycloak_read"
      - name: "GetActiveConnections"
        scope: "tool:keycloak_read"

# XAA Trusted Identity Providers configuration
trusted_identity_providers:
  - issuer: "https://external-idp.example.com"
    client_id: "external-client"
    jwks_url: "https://external-idp.example.com/oauth/jwks"
    role_mappings:
      "External-Admins": "Administrators"
      "External-Users": "Normal-Users"
