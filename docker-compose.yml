services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    user: "0:0"
    command: ["start-dev", "--log-level=debug"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_KEY_STORE_FILE: /opt/keycloak/conf/tls/keycloak.p12
      KC_HTTPS_KEY_STORE_PASSWORD: ${KEYCLOAK_HTTPS_KEY_STORE_PASSWORD:-}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-https://host.docker.internal:8443}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      - "127.0.0.1:8083:8080"
      - "8443:8443"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-tls:/opt/keycloak/conf/tls:ro
    restart: always


  spire-server:
    image: ghcr.io/spiffe/spire-server:1.8.0
    command:
      - "-config"
      - "/run/spire/config/server.conf"
    volumes:
      - ./spire/server:/run/spire/config
      - ./spire/certs:/run/spire/certs:ro
      - spire-server-data:/opt/spire/data
    restart: always


  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.8.0
    user: "0:0"
    pid: host
    command:
      - "-config"
      - "/run/spire/config/agent.conf"
    volumes:
      - ./spire/agent:/run/spire/config
      - ./spire/certs:/run/spire/certs:ro
      - ./spire/agent/passwd:/etc/passwd:ro
      - ./spire/agent/group:/etc/group:ro
      - spire-agent-data:/opt/spire/data
      - spire-agent-socket:/run/spire/sockets
    depends_on:
      - spire-server
    restart: always

  opa:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=:8182"
    ports:
      - "8182:8182"
    restart: always


  gateway:
    container_name: gateway_mcp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
      - "9090:9090"
      - "5002:5002"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_ISSUER_URL=${KEYCLOAK_ISSUER_URL:-https://host.docker.internal:8443}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-https://host.docker.internal:8443/realms/master/protocol/openid-connect/certs}
      - KEYCLOAK_TOKEN_URL=${KEYCLOAK_TOKEN_URL:-https://host.docker.internal:8443/realms/master/protocol/openid-connect/token}
      - KEYCLOAK_CA_BUNDLE=/app/keycloak-tls/root-ca.pem
      - OPA_URL=http://opa:8182/v1/data/runtime_shield/authz/decision
      - KEYCLOAK_REALM=master
      - HITL_TIMEOUT_SECONDS=${HITL_TIMEOUT_SECONDS:-180}
      - RUNTIME_SHIELD_LOGIN_CLIENT_ID=${RUNTIME_SHIELD_LOGIN_CLIENT_ID:-admin-cli}
      - RUNTIME_SHIELD_LOGIN_CLIENT_SECRET=${RUNTIME_SHIELD_LOGIN_CLIENT_SECRET:-}
      - KEYCLOAK_CLIENT_ID=runtime-shield-jit
      - KEYCLOAK_CLIENT_SECRET=${RUNTIME_SHIELD_JIT_CLIENT_SECRET:?set RUNTIME_SHIELD_JIT_CLIENT_SECRET}
      - RUNTIME_SHIELD_JIT_CLIENT_SECRET=${RUNTIME_SHIELD_JIT_CLIENT_SECRET:?set RUNTIME_SHIELD_JIT_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      - LOCAL_DEV_MODE=false
      - SPIFFE_ENABLED=true
      - SPIFFE_BRIDGE_ID=spiffe://runtime-shield/bridge
      - SPIFFE_SERVER_ID=spiffe://runtime-shield/secure-runtime-shield
      - ALLOWED_SPIFFE_IDS=spiffe://runtime-shield/agent,spiffe://runtime-shield/dashboard,spiffe://runtime-shield/bridge,spiffe://runtime-shield/secure-runtime-shield,spiffe://runtime-shield/llm-agent
      - SPIRE_AGENT_SOCKET=/run/spire/sockets/agent.sock
      - SPIFFE_SVID_PATH=/app/spire/certs/bridge.crt
      - SPIFFE_BUNDLE_PATH=/app/spire/certs/ca.crt
      - SPIFFE_HEADER_ONLY_FALLBACK=false
      - RUNTIME_SHIELD_FS_PROVIDER_URL=http://filesystem-provider:8765
      - RUNTIME_SHIELD_FS_PROVIDER_TOKEN=${RUNTIME_SHIELD_FS_PROVIDER_TOKEN:?set RUNTIME_SHIELD_FS_PROVIDER_TOKEN}
      - RUNTIME_SHIELD_GATEWAY_API_KEY=${RUNTIME_SHIELD_GATEWAY_API_KEY:?set RUNTIME_SHIELD_GATEWAY_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-${NIM_API_KEY:-}}
      - NIM_BASE_URL=https://integrate.api.nvidia.com/v1
      - HF_TOKEN=${HF_TOKEN:-${HUGGINGFACE_TOKEN:-}}
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
    volumes:
      - spire-agent-socket:/run/spire/sockets:ro
      - ./spire/certs:/app/spire/certs:ro
      - ./keycloak-tls/root-ca.pem:/app/keycloak-tls/root-ca.pem:ro
      - ./secure-experiment-zone:/app/secure-experiment-zone:ro
    networks:
      - default
      - filesystem-private
    depends_on:
      - keycloak
      - spire-agent
      - opa
      - mongodb
    restart: always

  filesystem-provider:
    container_name: runtime-shield-filesystem-provider
    build:
      context: .
      dockerfile: Dockerfile.filesystem-provider
    image: runtime-shield-filesystem-provider:workshop
    environment:
      - RUNTIME_SHIELD_FS_PROVIDER_TOKEN=${RUNTIME_SHIELD_FS_PROVIDER_TOKEN:?set RUNTIME_SHIELD_FS_PROVIDER_TOKEN}
      - RUNTIME_SHIELD_FS_PROVIDER_RUNTIME=runc
      - FS_PROVIDER_ROOT=/workspace/secure-experiment-zone
      - FS_PROVIDER_PORT=8765
    user: "10001:10001"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    volumes:
      - ./secure-experiment-zone:/workspace/secure-experiment-zone:rw
    expose:
      - "8765"
    networks:
      - filesystem-private
    runtime: runc
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped


  mongodb:
    container_name: mongodb_mcp
    image: mongo:latest
    volumes:
      - mongo-data:/data/db
    restart: always

  chatbot:
    container_name: chatbot_mcp
    image: ghcr.io/danny-avila/librechat:latest
    ports:
      - "3080:3080"
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - DOMAIN_CLIENT=http://localhost:3080
      - DOMAIN_SERVER=http://localhost:3080
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      - CREDS_KEY=${CREDS_KEY:?set CREDS_KEY}
      - CREDS_IV=${CREDS_IV:?set CREDS_IV}
      - CONFIG_PATH=/app/librechat.yaml
      - ALLOW_REGISTRATION=true
      - ALLOW_EMAIL_LOGIN=true
      - ALLOW_SOCIAL_LOGIN=true
      - ALLOW_SOCIAL_REGISTRATION=false
      - OPENID_ISSUER=${OPENID_ISSUER:-https://host.docker.internal:8443/realms/master}
      - OPENID_CLIENT_ID=${OPENID_CLIENT_ID:-runtime-shield-librechat}
      - OPENID_CLIENT_SECRET=${OPENID_CLIENT_SECRET:?set OPENID_CLIENT_SECRET}
      - OPENID_SESSION_SECRET=${OPENID_SESSION_SECRET:?set OPENID_SESSION_SECRET}
      - OPENID_CALLBACK_URL=/oauth/openid/callback
      - OPENID_SCOPE=openid profile email
      - OPENID_REUSE_TOKENS=true
      - OPENID_USE_END_SESSION_ENDPOINT=true
      - SESSION_EXPIRY=86400000
      - REFRESH_TOKEN_EXPIRY=604800000
      - NODE_EXTRA_CA_CERTS=/app/keycloak-tls/root-ca.pem
      - SPIFFE_LLM_ID=spiffe://runtime-shield/llm-agent
      - RUNTIME_SHIELD_MCP_CLIENT_ID=${RUNTIME_SHIELD_MCP_CLIENT_ID:-runtime-shield-hitl}
      - RUNTIME_SHIELD_MCP_CLIENT_SECRET=${RUNTIME_SHIELD_MCP_CLIENT_SECRET:?set RUNTIME_SHIELD_MCP_CLIENT_SECRET}
      - RUNTIME_SHIELD_GATEWAY_API_KEY=${RUNTIME_SHIELD_GATEWAY_API_KEY:?set RUNTIME_SHIELD_GATEWAY_API_KEY}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat-uploads:/app/uploads
      - librechat-images:/app/client/public/images
      - spire-agent-socket:/run/spire/sockets:ro
      - ./spire/certs:/app/spire/certs:ro
      - ./keycloak-tls/root-ca.pem:/app/keycloak-tls/root-ca.pem:ro
    depends_on:
      - gateway
      - mongodb
      - keycloak
    restart: always


volumes:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  keycloak-data:
  mongo-data:
  librechat-uploads:
  librechat-images:

networks:
  default:
    name: dokploy-network
    external: true
  filesystem-private:
    name: runtime-shield-filesystem-private
    driver: bridge
    internal: true
